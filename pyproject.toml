[project]
name = "daikin-d3net-modbus"
version = "0.2.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "modbus-connection[tmodbus]==4.12.4",
  "pymodbus==3.13.1",
  "tmodbus==0.6.2",
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
